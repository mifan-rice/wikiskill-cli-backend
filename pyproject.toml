[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiskill-cli-backend"
version = "0.1.0"
authors = [{ name = "Laohan", email = "311125144+mifan-rice@users.noreply.github.com" }]
description = "Unofficial execution backend: plug any one-shot agent CLI (hermes, codex, …) into the WikiSkill self-evolving skill loop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["wikiskill", "agent", "self-evolving", "skills", "backend"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
"Upstream paper" = "https://arxiv.org/abs/2608.27454"
"Upstream project" = "https://github.com/ashutoshsinghpr7/wikiskill"

[tool.setuptools]
py-modules = ["backend", "review"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F"]
